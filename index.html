<body class="bg-slate-50">
  <div id="root" class="min-h-screen bg-slate-50 flex justify-center"></div>

  <script>
  /* ---------------- Data layer ---------------- */
  const STORAGE_KEY = "xpns-data";

  const CATEGORIES = [
    { id: "expenses",      label: "Expenses",      icon: "receipt",       bg: "bg-slate-100",    text: "text-slate-700",   ring: "ring-slate-300" },
    { id: "entertainment", label: "Entertainment",  icon: "film",         bg: "bg-fuchsia-100",  text: "text-fuchsia-700", ring: "ring-fuchsia-300" },
    { id: "savings",       label: "Savings",        icon: "piggy-bank",   bg: "bg-emerald-100",  text: "text-emerald-700", ring: "ring-emerald-300" },
    { id: "wants",         label: "Wants",          icon: "shopping-bag", bg: "bg-amber-100",    text: "text-amber-700",   ring: "ring-amber-300" },
    { id: "loans",         label: "Loans/EMI",      icon: "credit-card",  bg: "bg-rose-100",     text: "text-rose-700",    ring: "ring-rose-300" },
  ];

  const CURRENCIES = [
    { code: "AED", symbol: "AED" },
    { code: "INR", symbol: "₹" },
    { code: "USD", symbol: "$" },
    { code: "EUR", symbol: "€" },
    { code: "GBP", symbol: "£" },
    { code: "SAR", symbol: "SAR" },
  ];

  function catInfo(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES[0]; }
  function currSymbol(code) { const c = CURRENCIES.find(c => c.code === code); return c ? c.symbol : code; }
  function fmt(n) { const num = Number(n) || 0; return num.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function niceDate(d) { const dt = new Date(d + "T00:00:00"); return dt.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "2-digit" }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return (s ?? "").toString().replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

  function sortTxns(txns) {
    return txns.slice().sort((a, b) => {
      if (a.date !== b.date) return b.date.localeCompare(a.date);
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  function totalsByCurrency(txns) {
    const map = {};
    for (const t of txns) {
      if (!map[t.currency]) map[t.currency] = { in: 0, out: 0 };
      if (t.type === "in") map[t.currency].in += Number(t.amount) || 0;
      else map[t.currency].out += Number(t.amount) || 0;
    }
    return map;
  }

  function categoryBreakdown(txns, currency) {
    const out = {};
    for (const t of txns) {
      if (t.type !== "out" || t.currency !== currency) continue;
      const cat = t.category || "expenses";
      out[cat] = (out[cat] || 0) + (Number(t.amount) || 0);
    }
    return CATEGORIES.map(c => ({ ...c, amount: out[c.id] || 0 })).filter(c => c.amount > 0);
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { sites: [], transactions: [] };
  }
  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ sites: state.sites, transactions: state.transactions }));
    } catch (e) {
      console.error("save failed", e);
    }
  }

  /* ---------------- App state ---------------- */
  const initial = loadData();
  const state = {
    sites: initial.sites || [],
    transactions: initial.transactions || [],
    view: "home",              // home | site | add | edit
    activeSiteId: null,
    addType: "out",
    editingTxnId: null,
    homeTab: "sites",          // sites | summary
    currencyTab: {},           // per-site selected currency tab: {siteId: code}
    showAddSite: false,
    confirmDeleteId: null,
    formError: "",
  };

  function go(view, patch = {}) { Object.assign(state, { view }, patch); render(); }

  /* ---------------- Icons (self-contained, no CDN) ---------------- */
  const ICON_PATHS = {
    "chevron-left": '<path d="M15 6l-6 6 6 6"/>',
    "plus": '<path d="M12 5v14M5 12h14"/>',
    "x": '<path d="M18 6 6 18M6 6l12 12"/>',
    "map-pin": '<path d="M12 21s7-6.4 7-11.5A7 7 0 0 0 5 9.5C5 14.6 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/>',
    "building-2": '<path d="M4 21V5.5A1.5 1.5 0 0 1 5.5 4h6A1.5 1.5 0 0 1 13 5.5V21"/><path d="M13 10.5h5.5A1.5 1.5 0 0 1 20 12v9"/><path d="M4 21h16"/><path d="M7.5 8h1.5M7.5 12h1.5M7.5 16h1.5M15.5 14h1.5M15.5 17.5h1.5"/>',
    "layout-grid": '<rect x="3" y="3" width="8" height="8" rx="1.6"/><rect x="13" y="3" width="8" height="8" rx="1.6"/><rect x="3" y="13" width="8" height="8" rx="1.6"/><rect x="13" y="13" width="8" height="8" rx="1.6"/>',
    "trash-2": '<path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1.5 1.5 0 0 0 1.5 1.4h7a1.5 1.5 0 0 0 1.5-1.4L18 7"/><path d="M10 11v6M14 11v6"/>',
    "receipt": '<path d="M6 3h12v17.2a.7.7 0 0 1-1.05.6l-1.7-1-1.7 1a.7.7 0 0 1-.7 0l-1.7-1-1.7 1a.7.7 0 0 1-.7 0l-1.7-1-1.7 1A.7.7 0 0 1 6 20.2V3z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    "film": '<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M3 15h18M8 4v16M16 4v16"/>',
    "piggy-bank": '<path d="M4.5 12a6.5 5.7 0 0 1 6.5-5.7h4c2.9 0 5.5 1.7 6.3 4.2h1.2a1 1 0 0 1 1 1.2l-.4 1.6a1 1 0 0 1-1 .8h-.9a6.4 6.4 0 0 1-2.2 3v2.4a1 1 0 0 1-1 1H16a1 1 0 0 1-1-1v-.9a8 8 0 0 1-2 .3 8 8 0 0 1-2-.3v.9a1 1 0 0 1-1 1H8.5a1 1 0 0 1-1-1v-2.4A6.3 6.3 0 0 1 4.5 12z"/><circle cx="16.3" cy="10.6" r="0.7" fill="currentColor" stroke="none"/><path d="M8 6.3 6.7 4.6M4.5 12H2.3"/>',
    "shopping-bag": '<path d="M6.5 8h11l1 12.2a1.5 1.5 0 0 1-1.5 1.6H7a1.5 1.5 0 0 1-1.5-1.6L6.5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
    "credit-card": '<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/><path d="M6 15h4"/>',
    "arrow-down-circle": '<circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v8M8.5 12 12 15.5 15.5 12"/>',
  };
  function iconSvg(name, size, cls) {
    const inner = ICON_PATHS[name] || "";
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="${cls || ""}" style="display:inline-block;vertical-align:-3px;flex-shrink:0">${inner}</svg>`;
  }

  /* ---------------- Logo (inline SVG) ---------------- */
  const LOGO_SVG = `
    <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="11" width="20" height="15" rx="3" fill="white" fill-opacity="0.18" />
      <rect x="4" y="11" width="20" height="15" rx="3" stroke="white" stroke-width="1.6" />
      <path d="M6.5 11V9.2C6.5 7.98 7.6 7.1 8.79 7.36L18 9.4" stroke="white" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="19.5" cy="18.5" r="1.8" fill="white" />
      <rect x="17" y="2" width="12" height="7.2" rx="1.4" transform="rotate(18 23 5.6)" fill="white" />
      <circle cx="24.3" cy="6.6" r="1.6" fill="#0B1B3F" transform="rotate(18 23 5.6)" />
    </svg>`;

  /* ---------------- Render helpers ---------------- */
  function icon(name, size = 16, cls = "") {
    return iconSvg(name, size, cls);
  }

  function summaryStat(label, value, valueClass) {
    return `
      <div class="flex-1 text-center">
        <div class="text-[11px] uppercase tracking-wide text-slate-400 font-medium">${label}</div>
        <div class="text-lg font-bold mt-0.5 ${valueClass || "text-slate-800"}">${value}</div>
      </div>`;
  }

  /* ---------------- Views ---------------- */
  function renderHome() {
    const overallTotals = totalsByCurrency(state.transactions);
    const overallCodes = Object.keys(overallTotals);

    const balanceStrip = overallCodes.length === 0
      ? `<div class="text-blue-100 text-sm text-center py-1">No transactions yet</div>`
      : `<div class="flex flex-wrap gap-x-6 gap-y-2">
          ${overallCodes.map(code => {
            const { in: cin, out } = overallTotals[code];
            const bal = cin - out;
            return `<div>
              <div class="text-[10px] uppercase tracking-wide text-blue-200">Balance · ${code}</div>
              <div class="text-base font-bold ${bal >= 0 ? "text-emerald-300" : "text-rose-300"}">
                ${bal >= 0 ? "+" : ""}${currSymbol(code)} ${fmt(bal)}
              </div>
            </div>`;
          }).join("")}
        </div>`;

    return `
      <div class="flex flex-col flex-1">
        <div class="bg-blue-950 pt-6 pb-5 px-5 rounded-b-3xl shadow-sm safe-top">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div class="w-10 h-10 rounded-2xl bg-white/15 flex items-center justify-center">${LOGO_SVG}</div>
              <div>
                <div class="text-white font-extrabold text-xl leading-tight tracking-tight">Xpns</div>
                <div class="text-blue-200 text-xs">Daily expense tracker</div>
              </div>
            </div>
          </div>
          <div class="mt-5 bg-white/10 rounded-2xl px-4 py-3">${balanceStrip}</div>
        </div>

        <div class="flex items-center gap-2 px-5 mt-4">
          <button data-action="home-tab" data-tab="sites" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-semibold transition ${state.homeTab === "sites" ? "bg-blue-950 text-white" : "bg-white text-slate-500 border border-slate-200"}">
            ${icon("building-2", 14)} Sites
          </button>
          <button data-action="home-tab" data-tab="summary" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-semibold transition ${state.homeTab === "summary" ? "bg-blue-950 text-white" : "bg-white text-slate-500 border border-slate-200"}">
            ${icon("layout-grid", 14)} By Category
          </button>
          <div class="flex-1"></div>
          <button data-action="add-site-open" class="flex items-center gap-1 text-blue-950 font-semibold text-sm px-2 py-1.5">
            ${icon("plus", 16)} Site
          </button>
        </div>

        <div class="flex-1 px-5 mt-3 pb-8 overflow-y-auto">
          ${state.homeTab === "sites" ? renderSitesList() : renderCategorySummary()}
        </div>
      </div>`;
  }

  function renderSitesList() {
    if (state.sites.length === 0) {
      return `
        <div class="mt-10 text-center">
          <div class="w-14 h-14 rounded-2xl bg-blue-100 flex items-center justify-center mx-auto mb-3">${icon("map-pin", 24, "text-blue-800")}</div>
          <div class="text-slate-700 font-semibold">No sites yet</div>
          <div class="text-slate-400 text-sm mt-1">Add a site or location to start tracking where you spend.</div>
          <button data-action="add-site-open" class="mt-4 bg-blue-950 text-white text-sm font-semibold px-4 py-2 rounded-xl">+ Add your first site</button>
        </div>`;
    }

    return `<div class="space-y-3">
      ${state.sites.map(site => {
        const siteTxns = state.transactions.filter(t => t.siteId === site.id);
        const map = totalsByCurrency(siteTxns);
        const codes = Object.keys(map);
        const topCurrency = codes[0];
        const topCats = topCurrency ? categoryBreakdown(siteTxns, topCurrency).slice(0, 3) : [];

        return `
        <button data-action="open-site" data-id="${site.id}" class="w-full text-left bg-white rounded-2xl border border-slate-200 shadow-sm px-4 py-3.5 active:scale-[0.99] transition">
          <div class="flex items-center justify-between">
            <div>
              <div class="font-bold text-slate-800">${esc(site.name)}</div>
              ${site.location ? `<div class="text-xs text-slate-400 flex items-center gap-1 mt-0.5">${icon("map-pin", 11)} ${esc(site.location)}</div>` : ""}
            </div>
            ${icon("chevron-left", 18, "text-slate-300 rotate-180")}
          </div>
          <div class="mt-2.5 pt-2.5 border-t border-slate-100">
            ${codes.length === 0
              ? `<div class="text-xs text-slate-400">No entries yet</div>`
              : `<div class="space-y-1">${codes.map(code => `
                  <div class="flex items-center justify-between text-sm">
                    <span class="text-emerald-600 font-semibold">${currSymbol(code)} ${fmt(map[code].in)} In</span>
                    <span class="text-rose-600 font-semibold">${currSymbol(code)} ${fmt(map[code].out)} Out</span>
                  </div>`).join("")}</div>`}
          </div>
          ${topCats.length > 0 ? `
            <div class="mt-2 flex flex-wrap gap-1.5">
              ${topCats.map(c => `
                <span class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full ${c.bg} ${c.text}">
                  ${icon(c.icon, 10)} ${currSymbol(topCurrency)} ${fmt(c.amount)}
                </span>`).join("")}
            </div>` : ""}
        </button>`;
      }).join("")}
    </div>`;
  }

  function renderCategorySummary() {
    const outTxns = state.transactions.filter(t => t.type === "out");
    if (outTxns.length === 0) {
      return `<div class="mt-10 text-center text-slate-400 text-sm">No spending yet. Categorized entries will show up here.</div>`;
    }
    const grouped = {};
    for (const t of outTxns) {
      const cat = t.category || "expenses";
      grouped[cat] = grouped[cat] || {};
      grouped[cat][t.currency] = (grouped[cat][t.currency] || 0) + (Number(t.amount) || 0);
    }
    return `<div class="space-y-3">
      ${CATEGORIES.map(cat => {
        const data = grouped[cat.id];
        if (!data) return "";
        return `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm px-4 py-3.5">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl ${cat.bg} flex items-center justify-center shrink-0">${icon(cat.icon, 17, cat.text)}</div>
            <div class="flex-1"><div class="font-semibold text-slate-800 text-sm">${cat.label}</div></div>
            <div class="text-right">
              ${Object.keys(data).map(code => `<div class="text-sm font-bold text-slate-700">${currSymbol(code)} ${fmt(data[code])}</div>`).join("")}
            </div>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  }

  function renderSite() {
    const site = state.sites.find(s => s.id === state.activeSiteId);
    if (!site) { go("home"); return ""; }
    const txns = state.transactions.filter(t => t.siteId === site.id);
    const map = totalsByCurrency(txns);
    const codes = Object.keys(map);
    if (!state.currencyTab[site.id] || !codes.includes(state.currencyTab[site.id])) {
      state.currencyTab[site.id] = codes[0] || "AED";
    }
    const currencyTab = state.currencyTab[site.id];
    const shown = map[currencyTab] || { in: 0, out: 0 };
    const balance = shown.in - shown.out;
    const cats = categoryBreakdown(txns, currencyTab);
    const sorted = sortTxns(txns);

    return `
      <div class="flex flex-col flex-1">
        <div class="bg-blue-950 pt-6 pb-4 px-4 rounded-b-3xl shadow-sm safe-top">
          <div class="flex items-center gap-3">
            <button data-action="go-home" class="text-white">${icon("chevron-left", 22)}</button>
            <div>
              <div class="text-white font-bold text-lg leading-tight">${esc(site.name)}</div>
              ${site.location ? `<div class="text-blue-200 text-xs">${esc(site.location)}</div>` : ""}
            </div>
          </div>
          ${codes.length > 1 ? `
            <div class="flex gap-1.5 mt-3">
              ${codes.map(code => `
                <button data-action="site-currency" data-code="${code}" class="text-xs font-semibold px-2.5 py-1 rounded-full ${currencyTab === code ? "bg-white text-blue-950" : "bg-white/15 text-blue-100"}">${code}</button>
              `).join("")}
            </div>` : ""}
          <div class="mt-4 bg-white rounded-2xl px-3 py-3.5 flex">
            ${summaryStat("Balance", `${balance >= 0 ? "+" : ""}${fmt(balance)}`, balance >= 0 ? "text-emerald-600" : "text-rose-600")}
            <div class="w-px bg-slate-100 mx-1"></div>
            ${summaryStat("Total In", fmt(shown.in), "text-emerald-600")}
            <div class="w-px bg-slate-100 mx-1"></div>
            ${summaryStat("Total Out", fmt(shown.out), "text-rose-600")}
          </div>
        </div>

        ${cats.length > 0 ? `
          <div class="px-4 mt-3">
            <div class="text-[11px] uppercase tracking-wide text-slate-400 font-semibold mb-1.5 px-0.5">By category · ${currencyTab}</div>
            <div class="flex gap-2 overflow-x-auto pb-1 -mx-0.5 px-0.5">
              ${cats.map(c => `
                <div class="shrink-0 flex items-center gap-1.5 ${c.bg} ${c.text} rounded-xl px-3 py-2 text-xs font-semibold">
                  ${icon(c.icon, 14)} <span>${c.label}</span> <span class="font-bold">${currSymbol(currencyTab)} ${fmt(c.amount)}</span>
                </div>`).join("")}
            </div>
          </div>` : ""}

        <div class="flex-1 px-4 mt-3 pb-24 overflow-y-auto">
          ${sorted.length === 0
            ? `<div class="mt-10 text-center text-slate-400 text-sm">No entries yet. Tap Payment In or Payment Out below to add one.</div>`
            : `<div class="space-y-2.5">${sorted.map(t => {
                const cat = catInfo(t.category);
                const iconName = t.type === "in" ? "arrow-down-circle" : cat.icon;
                return `
                <button data-action="edit-txn" data-id="${t.id}" class="w-full text-left bg-white rounded-2xl border border-slate-200 px-3.5 py-3 flex items-center gap-3 active:scale-[0.99] transition">
                  <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${t.type === "in" ? "bg-emerald-100" : cat.bg}">
                    ${icon(iconName, 18, t.type === "in" ? "text-emerald-600" : cat.text)}
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="font-semibold text-slate-800 text-sm truncate">${esc(t.party) || (t.type === "in" ? "Payment In" : "Payment Out")}</div>
                    <div class="text-xs text-slate-400 mt-0.5 truncate">${niceDate(t.date)}${t.description ? " · " + esc(t.description) : ""}</div>
                    ${t.type === "out" ? `<div class="inline-block mt-1 text-[10px] font-semibold px-2 py-0.5 rounded-full ${cat.bg} ${cat.text}">${cat.label}</div>` : ""}
                  </div>
                  <div class="font-bold text-sm shrink-0 ${t.type === "in" ? "text-emerald-600" : "text-rose-600"}">${t.type === "in" ? "+" : "-"}${currSymbol(t.currency)} ${fmt(t.amount)}</div>
                </button>`;
              }).join("")}</div>`}
        </div>

        <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-3 flex gap-3 safe-bottom">
          <button data-action="add-txn" data-type="in" class="flex-1 bg-emerald-600 text-white font-semibold text-sm py-3 rounded-xl active:scale-[0.98] transition">Payment In</button>
          <button data-action="add-txn" data-type="out" class="flex-1 bg-rose-600 text-white font-semibold text-sm py-3 rounded-xl active:scale-[0.98] transition">Payment Out</button>
        </div>
      </div>`;
  }

  function renderForm() {
    const isEdit = state.view === "edit";
    const site = state.sites.find(s => s.id === state.activeSiteId);
    const editing = isEdit ? state.transactions.find(t => t.id === state.editingTxnId) : null;
    const type = isEdit ? editing.type : state.addType;
    const isOut = type === "out";

    const f = state.formDraft || {
      party: editing?.party || "",
      amount: editing ? String(editing.amount) : "",
      currency: editing?.currency || "AED",
      category: editing?.category || "expenses",
      description: editing?.description || "",
      reference: editing?.reference || "",
      date: editing?.date || todayStr(),
    };
    state.formDraft = f;

    return `
      <div class="flex flex-col flex-1 bg-white min-h-screen">
        <div class="px-4 pt-6 pb-4 ${isOut ? "bg-rose-600" : "bg-emerald-600"} flex items-center gap-3 safe-top">
          <button data-action="form-cancel" class="text-white">${icon("chevron-left", 22)}</button>
          <div class="flex-1">
            <div class="text-white font-bold text-lg">${isEdit ? "Edit " : ""}${isOut ? "Payment Out" : "Payment In"}</div>
            <div class="text-white/70 text-xs">${esc(site.name)}</div>
          </div>
          ${isEdit ? `<button data-action="delete-open" class="text-white/90">${icon("trash-2", 19)}</button>` : ""}
        </div>

        <div class="flex-1 px-4 py-4 space-y-4 overflow-y-auto pb-8">
          <div>
            <label class="text-xs font-semibold text-slate-500 mb-1 block">${isOut ? "To Party *" : "From Party *"}</label>
            <input id="f-party" value="${esc(f.party)}" placeholder="${isOut ? "Who did you pay?" : "Who paid you?"}" class="w-full border border-slate-200 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>

          <div>
            <label class="text-xs font-semibold text-slate-500 mb-1 block">Amount</label>
            <div class="flex gap-2">
              <select id="f-currency" class="border border-slate-200 rounded-xl px-2.5 py-3 text-sm font-semibold bg-white focus:outline-none focus:ring-2 focus:ring-blue-600">
                ${CURRENCIES.map(c => `<option value="${c.code}" ${f.currency === c.code ? "selected" : ""}>${c.code}</option>`).join("")}
              </select>
              <input id="f-amount" value="${esc(f.amount)}" inputmode="decimal" placeholder="0.00" class="flex-1 border border-slate-200 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold text-slate-500 mb-1 block">Date</label>
            <input id="f-date" type="date" value="${f.date}" class="w-full border border-slate-200 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>

          ${isOut ? `
          <div>
            <label class="text-xs font-semibold text-slate-500 mb-2 block">Category</label>
            <div class="grid grid-cols-2 gap-2">
              ${CATEGORIES.map(cat => {
                const active = f.category === cat.id;
                return `
                <button type="button" data-action="pick-category" data-cat="${cat.id}" class="flex items-center gap-2 px-3 py-2.5 rounded-xl border text-sm font-semibold transition ${active ? `${cat.bg} ${cat.text} border-transparent ring-2 ${cat.ring}` : "border-slate-200 text-slate-500"}">
                  ${icon(cat.icon, 16)} ${cat.label}
                </button>`;
              }).join("")}
            </div>
          </div>` : ""}

          <div>
            <label class="text-xs font-semibold text-slate-500 mb-1 block">Description</label>
            <textarea id="f-description" rows="2" placeholder="What was this for?" class="w-full border border-slate-200 rounded-xl px-3.5 py-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-600">${esc(f.description)}</textarea>
          </div>

          <div>
            <label class="text-xs font-semibold text-slate-500 mb-1 block">Reference Number</label>
            <input id="f-reference" value="${esc(f.reference)}" placeholder="Optional" class="w-full border border-slate-200 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>

          ${state.formError ? `<div class="text-rose-600 text-xs font-medium">${esc(state.formError)}</div>` : ""}
        </div>

        <div class="px-4 py-3 border-t border-slate-200 safe-bottom">
          <button data-action="form-save" class="w-full text-white font-semibold text-sm py-3.5 rounded-xl active:scale-[0.98] transition ${isOut ? "bg-rose-600" : "bg-emerald-600"}">${isEdit ? "Save Changes" : "Save"}</button>
        </div>
      </div>

      ${state.confirmDeleteId ? `
      <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-30 px-6">
        <div class="w-full max-w-xs bg-white rounded-2xl p-5">
          <div class="font-bold text-slate-800 text-base">Delete this entry?</div>
          <div class="text-sm text-slate-500 mt-1">This can't be undone.</div>
          <div class="flex gap-2 mt-4">
            <button data-action="delete-cancel" class="flex-1 border border-slate-200 text-slate-600 font-semibold text-sm py-2.5 rounded-xl">Cancel</button>
            <button data-action="delete-confirm" class="flex-1 bg-rose-600 text-white font-semibold text-sm py-2.5 rounded-xl">Delete</button>
          </div>
        </div>
      </div>` : ""}`;
  }

  function renderAddSiteModal() {
    if (!state.showAddSite) return "";
    const d = state.addSiteDraft || { name: "", location: "" };
    state.addSiteDraft = d;
    return `
    <div class="fixed inset-0 bg-black/40 flex items-end justify-center z-20">
      <div class="w-full max-w-md bg-white rounded-t-3xl px-5 pt-4 pb-6 safe-bottom">
        <div class="flex items-center justify-between mb-4">
          <div class="font-bold text-slate-800 text-base">Add Site</div>
          <button data-action="add-site-close" class="text-slate-400">${icon("x", 20)}</button>
        </div>
        <div class="space-y-3">
          <div>
            <label class="text-xs font-semibold text-slate-500 mb-1 block">Site Name *</label>
            <input id="as-name" value="${esc(d.name)}" placeholder="e.g. Home, Office, Project Site" class="w-full border border-slate-200 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 mb-1 block">Location</label>
            <input id="as-location" value="${esc(d.location)}" placeholder="Optional" class="w-full border border-slate-200 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          ${state.addSiteError ? `<div class="text-rose-600 text-xs font-medium">${esc(state.addSiteError)}</div>` : ""}
        </div>
        <button data-action="add-site-save" class="w-full mt-5 bg-blue-950 text-white font-semibold text-sm py-3.5 rounded-xl active:scale-[0.98] transition">Save Site</button>
      </div>
    </div>`;
  }

  /* ---------------- Main render + event delegation ---------------- */
  const root = document.getElementById("root");

  function render() {
    let html = `<div class="w-full max-w-md bg-slate-50 min-h-screen flex flex-col relative">`;
    if (state.view === "home") html += renderHome();
    else if (state.view === "site") html += renderSite();
    else if (state.view === "add" || state.view === "edit") html += renderForm();
    html += renderAddSiteModal();
    html += `</div>`;
    root.innerHTML = html;
    wireInputs();
  }

  function wireInputs() {
    const f = state.formDraft;
    if (f) {
      const bind = (id, key) => { const el = document.getElementById(id); if (el) el.addEventListener("input", () => { f[key] = el.value; }); };
      bind("f-party", "party");
      bind("f-amount", "amount");
      bind("f-date", "date");
      bind("f-description", "description");
      bind("f-reference", "reference");
      const amountEl = document.getElementById("f-amount");
      if (amountEl) amountEl.addEventListener("input", () => { amountEl.value = amountEl.value.replace(/[^0-9.]/g, ""); f.amount = amountEl.value; });
      const curEl = document.getElementById("f-currency");
      if (curEl) curEl.addEventListener("change", () => { f.currency = curEl.value; });
    }
    const asd = state.addSiteDraft;
    if (asd) {
      const bindA = (id, key) => { const el = document.getElementById(id); if (el) el.addEventListener("input", () => { asd[key] = el.value; }); };
      bindA("as-name", "name");
      bindA("as-location", "location");
    }
  }

  root.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;

    if (action === "home-tab") { state.homeTab = el.dataset.tab; render(); }
    else if (action === "add-site-open") { state.showAddSite = true; state.addSiteDraft = { name: "", location: "" }; state.addSiteError = ""; render(); }
    else if (action === "add-site-close") { state.showAddSite = false; render(); }
    else if (action === "add-site-save") {
      const d = state.addSiteDraft;
      if (!d.name.trim()) { state.addSiteError = "Please enter a site name"; render(); return; }
      const site = { id: uid(), name: d.name.trim(), location: d.location.trim() };
      state.sites = [site, ...state.sites];
      saveData();
      state.showAddSite = false;
      render();
    }
    else if (action === "open-site") { state.activeSiteId = el.dataset.id; go("site"); }
    else if (action === "go-home") { go("home"); }
    else if (action === "site-currency") { state.currencyTab[state.activeSiteId] = el.dataset.code; render(); }
    else if (action === "add-txn") { state.addType = el.dataset.type; state.formDraft = null; state.formError = ""; go("add"); }
    else if (action === "edit-txn") { state.editingTxnId = el.dataset.id; state.formDraft = null; state.formError = ""; go("edit"); }
    else if (action === "form-cancel") { state.formDraft = null; state.confirmDeleteId = null; go("site"); }
    else if (action === "pick-category") { state.formDraft.category = el.dataset.cat; render(); }
    else if (action === "form-save") {
      const f = state.formDraft;
      const isEdit = state.view === "edit";
      const type = isEdit ? state.transactions.find(t => t.id === state.editingTxnId).type : state.addType;
      if (!f.party.trim()) { state.formError = "Please enter a party name"; render(); return; }
      if (!f.amount || Number(f.amount) <= 0) { state.formError = "Please enter a valid amount"; render(); return; }
      state.formError = "";
      const payload = {
        party: f.party.trim(),
        amount: Number(f.amount),
        currency: f.currency,
        category: type === "out" ? f.category : null,
        description: f.description.trim(),
        reference: f.reference.trim(),
        date: f.date,
        type,
      };
      if (isEdit) {
        state.transactions = state.transactions.map(t => t.id === state.editingTxnId ? { ...t, ...payload, updatedAt: Date.now() } : t);
      } else {
        state.transactions = [{ ...payload, id: uid(), siteId: state.activeSiteId, createdAt: Date.now() }, ...state.transactions];
      }
      saveData();
      state.formDraft = null;
      state.editingTxnId = null;
      go("site");
    }
    else if (action === "delete-open") { state.confirmDeleteId = state.editingTxnId; render(); }
    else if (action === "delete-cancel") { state.confirmDeleteId = null; render(); }
    else if (action === "delete-confirm") {
      state.transactions = state.transactions.filter(t => t.id !== state.editingTxnId);
      saveData();
      state.confirmDeleteId = null;
      state.editingTxnId = null;
      state.formDraft = null;
      go("site");
    }
  });

  render();

  /* ---------------- Register service worker (for offline / installability) ---------------- */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
  </script>
</body>
</html>
